version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    # typescript-eslint does not support TypeScript 7.x yet (see typescript-eslint#10940).
    # Keep ~6.x until eslint stack supports 7; upgrade compiler + eslint together in a feature PR.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # vitest and @vitest/coverage-v8 must be the exact same version (the coverage plugin pins its vitest peer), but
    # client/.npmrc sets legacy-peer-deps, so npm would not flag a mismatch. Bump them in one PR.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: npm
    directory: /client/.vite/deps
    schedule:
      interval: weekly
