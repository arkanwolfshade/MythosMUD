name: PR Issue References

# Warn (never block) when a PR references an open issue without a GitHub closing keyword.
# See scripts/check_pr_issue_references.py for the rationale -- this project has shipped six
# fixes (#618-#629) whose PRs referenced the issue in prose but never closed it.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  check-issue-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/check_pr_issue_references.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check issue references
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_pr_issue_references.py
