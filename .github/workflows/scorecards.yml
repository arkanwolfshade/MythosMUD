# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.

name: Scorecard supply-chain security
on:
  # For Branch-Protection check. Only the default branch is supported. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
  branch_protection_rule:
  # To guarantee Maintained check is occasionally updated. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  schedule:
    - cron: "20 7 * * 2"
  push:
    branches: ["main"]
  # Manual re-run after ruleset hardening (Scorecard Branch-Protection).
  workflow_dispatch:

# Declare default permissions as read only.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write
      contents: read
      actions: read
      # To allow GraphQL ListCommits to work
      issues: read
      pull-requests: read
      # To detect SAST tools
      checks: read

    steps:
      # Block mode: only the hosts below may be reached (built from Harden-Runner's per-connection log over 12 runs,
      # plus hosts the actions' code calls). See ci.yml's backend job for how the list works and what is implicit.
      - name: Harden the runner (block all but allowed outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            api.deps.dev:443
            api.osv.dev:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            www.bestpractices.dev:443
      # Standard bootstrap: harden + checkout
      # github.token for parent repo; GITHUB_TOKEN cannot read other private repos.
      # https://docs.github.com/en/actions/security-guides/automatic-token-authentication

      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          token: ${{ github.token }}

      - name: Resolve data submodule (repository + commit)
        id: data_submodule
        run: |
          set -euo pipefail
          data_url="$(git config -f .gitmodules --get submodule.data.url)"
          suffix="${data_url#https://github.com/}"
          suffix="${suffix%.git}"
          if [ -z "${suffix}" ] || [ "${suffix}" = "${data_url}" ]; then
            echo "::error::submodule.data.url must be https://github.com/OWNER/REPO.git"
            exit 1
          fi
          line=$(git ls-tree HEAD data)
          mode=$(echo "${line}" | awk '{print $1}')
          kind=$(echo "${line}" | awk '{print $2}')
          sha=$(echo "${line}" | awk '{print $3}')
          if [ "${mode}" != "160000" ] || [ "${kind}" != "commit" ] || [ -z "${sha}" ]; then
            echo "::error::Path data is not a git submodule at HEAD (expected gitlink 160000 commit)."
            exit 1
          fi
          echo "repository=${suffix}" >> "${GITHUB_OUTPUT}"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "::notice::Will fetch ${suffix}@${sha}"
      - name: Clone private data into data/
        env:
          SUBMODULE_PAT: ${{ secrets.MYTHOSMUD_PAT }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          pat_trim=$(printf '%s' "${SUBMODULE_PAT}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "${pat_trim}" ]; then
            echo "::notice::No MYTHOSMUD_PAT in this run (common for Dependabot pull_request workflows). Scorecard continues with a placeholder data/ directory; optional: add the same PAT under Dependabot secrets for a full mythosmud_data checkout."
            rm -rf data
            mkdir -p data
            printf '%s\n' \
              "Placeholder: private submodule mythosmud_data was not cloned (no secrets in this workflow context)." \
              "CI with PAT: clone runs as before." \
              > data/README.scorecard-placeholder.md
            exit 0
          fi
          case "${pat_trim}" in
            github_pat_*) git_user="x-access-token" ;;
            *) git_user="${GITHUB_REPOSITORY_OWNER}" ;;
          esac
          repo="${{ steps.data_submodule.outputs.repository }}"
          sha="${{ steps.data_submodule.outputs.sha }}"
          export GIT_USER_Q="${git_user}" PAT_Q="${pat_trim}"
          auth_host=$(python3 -c "import os, urllib.parse as u; x=os.environ['GIT_USER_Q']; y=os.environ['PAT_Q']; print(u.quote(x, safe='') + ':' + u.quote(y, safe=''))")
          unset GIT_USER_Q PAT_Q
          rm -rf data
          mkdir data
          cd data
          git init -q
          git remote add origin "https://${auth_host}@github.com/${repo}.git"
          GIT_TERMINAL_PROMPT=0 git fetch --depth 1 origin "${sha}"
          git checkout -q FETCH_HEAD
          git remote set-url origin "https://github.com/${repo}.git"
          cd ..

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # (Optional) "write" PAT token. Uncomment the `repo_token` line below if:
          # - you want to enable the Branch-Protection check on a *public* repository, or
          # - you are installing Scorecards on a *private* repository
          # To create the PAT, follow the steps in https://github.com/ossf/scorecard-action#authentication-with-pat.
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

          # Public repositories:
          #   - Publish results to OpenSSF REST API for easy access by consumers
          #   - Allows the repository to include the Scorecard badge.
          #   - See https://github.com/ossf/scorecard-action#publishing-results.
          # For private repositories:
          #   - `publish_results` will always be set to `false`, regardless
          #     of the value entered here.
          # When `publish_results` is true, scorecard-action enforces that every step in
          # this job is one of a short allow-listed actions only (no custom `run:`).
          # This workflow uses shell steps for optional mythosmud_data checkout; keep
          # publish_results false so analysis + SARIF upload to code scanning still run.
          publish_results: false

      # Upload the results as artifacts (optional). Commenting out will disable uploads of run results in SARIF
      # format to the repository Actions tab.
      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Upload the results to GitHub's code scanning dashboard.
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@ba454b8ab46733eb6145342877cd148270bb77ab # codeql-bundle-v2.23.5
        with:
          sarif_file: results.sarif
